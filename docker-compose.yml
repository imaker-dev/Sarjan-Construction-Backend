services:
  postgres:
    image: postgres:16-alpine
    container_name: sarjan-erp-postgres
    environment:
      POSTGRES_USER: erp_dev
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: erp_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_dev -d erp_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sarjan-erp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
